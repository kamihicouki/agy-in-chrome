<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agy in chrome – 添付の設定</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="attachment-settings.mjs"></script>
</head>
<body>
  <main>
    <header><h1>Antigravity へのページ添付</h1></header>
    <section id="welcome">
      <p id="description"></p>
      <button id="allow" type="button" class="primary" hidden>Chrome で許可</button>
      <p id="status" role="status"></p>
      <section id="all-sites" hidden aria-labelledby="all-sites-title">
        <span class="agy-brand-chip">agy in chrome</span>
        <h2 id="all-sites-title">サイトの読み取りを一括許可</h2>
        <p id="all-sites-description">任意の設定です。Chrome で全 HTTP・HTTPS サイトへのアクセスを許可すると、サイトごとの許可操作を省けます。ページ本文は、Add Context で添付するか、右クリックから資料を用意するときに読み取ります。</p>
        <button id="allow-all-sites" type="button" aria-describedby="all-sites-description">全 HTTP・HTTPS サイトを許可</button>
        <p id="all-sites-status" role="status"></p>
        <p>Chrome の拡張機能の「サイトへのアクセス」で変更できます。</p>
      </section>
      <section id="diagnostics" hidden aria-labelledby="diagnostics-title">
        <h2 id="diagnostics-title">公式サイドパネルとの接続状態</h2>
        <ul id="checks"></ul>
        <button id="check-again" type="button">接続状態を再確認</button>
      </section>
    </section>
  </main>
</body>
</html>
