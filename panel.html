<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity Remote Sidebar</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" type="module"></script>
</head>
<body>
  <main>
    <h1>Antigravity</h1>
    <label for="mode">公式画面の開き方</label>
    <select id="mode">
      <option value="split">分割表示</option>
      <option value="tab">別タブ</option>
      <option value="window">別ウィンドウ</option>
    </select>

    <h2>現在のタブを共有</h2>
    <label><input id="viewport" type="checkbox"> 表示領域のテキストも含める</label>
    <button id="capture" type="button">タブの情報を取得</button>
    <label for="preview">コピーする内容</label>
    <textarea id="preview" rows="8" disabled></textarea>
    <button id="copy" type="button" disabled>コピーして開く</button>
    <button id="open" type="button">公式画面を開く</button>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
