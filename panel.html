<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agy in chrome</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <button id="sessions" type="button" aria-expanded="false">会話</button>
      <h1 id="title">agy in chrome</h1>
      <details id="options">
        <summary aria-label="表示オプション">⋯</summary>
        <div class="popup">
          <button id="split" type="button">公式画面を分割表示</button>
          <button id="tab" type="button">公式画面を別タブで開く</button>
          <button id="window" type="button">公式画面を別ウィンドウで開く</button>
          <button id="dashboard" type="button">接続先を選び直す</button>
        </div>
      </details>
    </header>
    <nav id="session-list" aria-label="会話一覧" hidden></nav>
    <section id="welcome" aria-labelledby="desktop-title">
      <h2 id="desktop-title">Antigravity Desktop</h2>
      <p>Desktop で Remote Control を有効にし、Chrome でも同じ Google アカウントを使います。</p>
      <button id="desktop" class="primary" type="button">Desktop の会話を開く</button>
      <p id="remote-target" hidden></p>
      <details id="remote-settings">
        <summary>接続先リンク</summary>
        <form id="remote-form" novalidate>
          <label for="remote-link">公式の端末・会話リンク</label>
          <input id="remote-link" type="url" placeholder="https://antigravity.google.com/r/…" maxlength="2048"
            aria-describedby="remote-tip remote-error">
          <p id="remote-tip">公式画面の URL を貼り付けます。リンクはこの Chrome に保存されます。</p>
          <p id="remote-error" role="alert"></p>
          <div class="remote-actions">
            <button id="save-remote" type="submit" disabled>保存</button>
            <button id="clear-remote" type="button" hidden>保存を解除</button>
          </div>
        </form>
      </details>
      <button id="choose-remote" class="quiet-button" type="button" hidden>接続先を選び直す</button>
      <p id="remote-status" role="status"></p>
      <p class="welcome-note">表示中のタブを資料として添えるには、サイドバーで新しい会話を始めます。</p>
    </section>
    <section id="thread" role="log" aria-label="会話" hidden></section>
    <footer>
      <p id="status" role="status"></p>
      <button id="connect" type="button">サイドバーで新しい会話</button>
      <a id="local-setup" href="https://github.com/kamihicouki/agy-in-chrome#ローカル-cli-のセットアップ" target="_blank" rel="noopener noreferrer" hidden>ローカル接続の手順</a>
      <form id="composer" aria-label="メッセージ作成" hidden>
        <div id="attachment" hidden>
          <button id="inspect" type="button" aria-expanded="false"></button>
          <button id="remove" type="button" aria-label="資料を外す">×</button>
        </div>
        <pre id="attachment-preview" hidden></pre>
        <div class="compose">
          <details id="capture">
            <summary aria-label="タブの資料を追加">＋</summary>
            <div class="popup">
              <button id="capture-selection" type="button">現在のタブと選択した文章</button>
              <button id="capture-viewport" type="button">表示領域のテキストを含める</button>
            </div>
          </details>
          <label class="sr-only" for="prompt">メッセージ</label>
          <textarea id="prompt" rows="1" maxlength="20000" placeholder="このページについて質問"></textarea>
          <button id="send" type="submit" disabled>送信</button>
          <button id="stop" type="button" hidden>停止</button>
        </div>
      </form>
    </footer>
  </main>
</body>
</html>
