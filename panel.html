<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agy in chrome</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <h1 id="title">agy in chrome</h1>
      <details id="options">
        <summary aria-label="表示オプション">⋯</summary>
        <div class="popup">
          <button id="split" type="button">公式画面を分割表示</button>
          <button id="tab" type="button">公式画面を別タブで開く</button>
          <button id="window" type="button">公式画面を別ウィンドウで開く</button>
          <button id="dashboard" type="button">接続先を選び直す</button>
        </div>
      </details>
    </header>
    <section id="welcome" aria-labelledby="desktop-title">
      <h2 id="desktop-title">Antigravity Desktop</h2>
      <p>Desktop と同じ Google アカウントで公式 Remote Control を使います。</p>
      <button id="desktop" class="primary" type="button">公式サイドパネルに戻る</button>
      <p id="remote-target" hidden></p>
      <details id="remote-settings">
        <summary>接続先リンク</summary>
        <form id="remote-form" novalidate>
          <label for="remote-link">公式の端末・会話リンク</label>
          <input id="remote-link" type="url" placeholder="https://antigravity.google.com/r/…" maxlength="2048"
            aria-describedby="remote-tip remote-error">
          <p id="remote-tip">公式画面の URL を貼り付けます。リンクはこの Chrome に保存されます。</p>
          <p id="remote-error" role="alert"></p>
          <div class="remote-actions">
            <button id="save-remote" type="submit" disabled>保存</button>
            <button id="clear-remote" type="button" hidden>保存を解除</button>
          </div>
        </form>
      </details>
      <button id="choose-remote" class="quiet-button" type="button" hidden>接続先を選び直す</button>
      <p id="remote-status" role="status"></p>

    </section>
    <section id="page-context" aria-labelledby="context-title">
      <h2 id="context-title">このページの資料</h2>
      <div class="remote-actions">
        <button id="capture-selection" type="button">タブと選択テキスト</button>
        <button id="capture-viewport" type="button">表示領域も含める</button>
      </div>
      <textarea id="attachment-preview" aria-label="コピーする資料" rows="6" hidden></textarea>
      <button id="copy-context" type="button" hidden>資料をコピー</button>
      <p id="context-status" role="status"></p>
    </section>
  </main>
</body>
</html>
