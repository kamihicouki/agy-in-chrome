name: Chrome Web Store

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      verify_access:
        description: Verify service-account access and read the store status without submitting
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store-production
  queue: max

jobs:
  package:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: build
        run: |
          for script in ./*.js ./*.mjs; do node --check "$script"; done
          node --test tests/*.test.mjs
          node --check scripts/publish-store.mjs
          python3 scripts/package.py
          unzip -t dist/*.zip
          version=$(node -p 'require("./manifest.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chrome-extension
          path: dist/*.zip
          if-no-files-found: error
          overwrite: true
  release:
    needs: package
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension
          path: dist
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v$VERSION"
          archive="dist/agy-in-chrome-$VERSION.zip"
          test -f "$archive"
          if release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets); then
            if [[ $(jq -r '.isDraft' <<< "$release") == false ]]; then
              echo "GitHub Release $tag is already published."
              exit 0
            fi
            if [[ $(jq -r '.targetCommitish' <<< "$release") != "$GITHUB_SHA" ]]; then
              echo "Draft $tag belongs to a different commit." >&2
              exit 1
            fi
            tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag belongs to a different commit." >&2
              exit 1
            fi
            if ! jq -e --arg name "${archive##*/}" '.assets | any(.name == $name and .state == "uploaded")' <<< "$release" >/dev/null; then
              gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          existing_tag=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag")
          if [[ -z "$existing_tag" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag belongs to a different commit." >&2
            exit 1
          fi
          gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$GITHUB_SHA" --title "agy in chrome $VERSION" --generate-notes
  submit:
    needs: package
    if: github.ref == 'refs/heads/production' && (inputs.verify_access || vars.CWS_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - if: '!inputs.verify_access'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension
          path: dist
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - run: |
          if [[ "$VERIFY_ACCESS" == 'true' ]]; then
            node scripts/publish-store.mjs --verify-access
          else
            node scripts/publish-store.mjs
          fi
        env:
          VERIFY_ACCESS: ${{ inputs.verify_access }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
